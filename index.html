<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I_Sokie Enterprises</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .page-layout {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        /* Top block: applications on the left, logo centered as before. */
        .top-section {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-container {
            width: 50vw;
            text-align: center;
        }

        .home-container img {
            display: block;
            max-width: 100%;
            max-height: 55vh;
            width: auto;
            height: auto;
            margin: 0 auto;
        }

        .app-panel {
            position: absolute;
            right: calc(75% + 35px);
            top: 50%;
            transform: translateY(-50%);
            width: 285px;
            padding: 16px;
            border: 2px solid #777;
            border-radius: 12px;
            background: #fafafa;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .app-panel h2 {
            margin: 0 0 14px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: normal;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 76px;
            margin: 10px 0;
            padding: 10px 12px;
            border: 1px solid #777;
            border-radius: 10px;
            color: #111;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
        }

        .trope-card {
            background-color: #f8dfe7;
        }

        .sefaria-card {
            background-color: #e2f2df;
        }

        .trans-card {
            background-color: #dcecf8;
        }

        .app-icon {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            object-fit: contain;
        }

        .app-text {
            min-width: 0;
            text-align: left;
        }

        .app-name {
            display: block;
            margin-bottom: 4px;
            font-size: 1rem;
            font-weight: bold;
        }

        .app-domain {
            display: block;
            font-size: 0.78rem;
            color: #444;
            overflow-wrap: anywhere;
        }

        /* Separate lower row spanning beneath the entire top block. */
        .thread-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            width: min(900px, 90vw);
            margin-top: 28px;
        }

        .thread-image {
            width: 185px;
            height: auto;
            flex: 0 0 auto;
        }

        .thread-text {
            font-size: 1rem;
            line-height: 1.4;
            color: #222;
            text-align: left;
            white-space: nowrap;
        }

        @media (max-width: 1050px) {
            .top-section {
                flex-direction: column;
                gap: 28px;
            }

            .app-panel {
                position: static;
                transform: none;
                width: min(90vw, 360px);
                order: 2;
            }

            .home-container {
                width: min(80vw, 650px);
                order: 1;
            }

            .thread-section {
                margin-top: 30px;
            }
        }

        @media (max-width: 700px) {
            .thread-section {
                flex-direction: column;
                gap: 15px;
            }

            .thread-text {
                white-space: normal;
                text-align: center;
                max-width: 520px;
            }
        }
    </style>
</head>

<body>
    <div class="page-layout">

        <div class="top-section">

            <aside class="app-panel" aria-label="I_Sokie applications">
                <h2>Applications</h2>

                <a class="app-card trope-card" href="https://trope.isokie.com/">
                    <img class="app-icon" src="https://trope.isokie.com/favicon.ico" alt="">
                    <span class="app-text">
                        <span class="app-name">Trope Player</span>
                        <span class="app-domain">trope.isokie.com</span>
                    </span>
                </a>

                <a class="app-card sefaria-card" href="https://sefaria.isokie.com/">
                    <img class="app-icon" src="https://sefaria.isokie.com/favicon.ico" alt="">
                    <span class="app-text">
                        <span class="app-name">Sefaria Hebrew</span>
                        <span class="app-domain">sefaria.isokie.com</span>
                    </span>
                </a>

                <a class="app-card trans-card" href="https://trans.isokie.com/">
                    <img class="app-icon" src="https://trans.isokie.com/favicon.ico" alt="">
                    <span class="app-text">
                        <span class="app-name">Transliteration Engine</span>
                        <span class="app-domain">trans.isokie.com</span>
                    </span>
                </a>
            </aside>

            <main class="home-container">
                <img src="ISokieLogo_SM_Clear.png"
                     alt="I_Sokie Enterprises">
            </main>

        </div>

        <div class="thread-section">
            <img src="Thread.png"
                 class="thread-image"
                 alt="Thread">

            <div class="thread-text">
                A common thread for generating resources for<br>
                Torah text retrieval and trope processing.
            </div>
        </div>

    </div>
</body>
</html>
