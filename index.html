<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I_Sokie Enterprises</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .page-layout {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Keep the existing logo/home-page block centered on the page. */
        .home-container {
            width: 50vw;
            text-align: center;
        }

        .home-container img {
            display: block;
            max-width: 100%;
            max-height: 55vh;
            width: auto;
            height: auto;
            margin: 0 auto;
        }

        .thread-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 45px;
    width: 100%;
    margin-top: 35px;
}

.thread-image {
    width: 230px;
    height: auto;
    flex-shrink: 0;
}

.thread-text {
    max-width: 430px;
    text-align: left;
    font-size: 1.35rem;
    line-height: 1.45;
    color: #222;
}

        /* Application selector positioned to the left of the centered logo. */
        .app-panel {
            position: absolute;
            right: calc(75% + 35px);
            top: 50%;
            transform: translateY(-50%);
            width: 285px;
            padding: 16px;
            border: 2px solid #777;
            border-radius: 12px;
            background: #fafafa;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .app-panel h2 {
            margin: 0 0 14px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: normal;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 76px;
            margin: 10px 0;
            padding: 10px 12px;
            border: 1px solid #777;
            border-radius: 10px;
            color: #111;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
        }

        .trope-card {
            background-color: #f8dfe7;
        }

        .sefaria-card {
            background-color: #e2f2df;
        }

        .trans-card {
            background-color: #dcecf8;
        }

        .app-icon {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            object-fit: contain;
        }

        .app-text {
            min-width: 0;
            text-align: left;
        }

        .app-name {
            display: block;
            margin-bottom: 4px;
            font-size: 1rem;
            font-weight: bold;
        }

        .app-domain {
            display: block;
            font-size: 0.78rem;
            color: #444;
            overflow-wrap: anywhere;
        }

        @media (max-width: 1050px) {
            .page-layout {
                flex-direction: column;
                justify-content: center;
                gap: 28px;
                padding: 30px 18px;
            }

            .app-panel {
                position: static;
                transform: none;
                width: min(90vw, 360px);
                order: 2;
            }

            .home-container {
                width: min(80vw, 650px);
                order: 1;
            }
        }
    </style>
</head>

<body>
    <div class="page-layout">

        <aside class="app-panel" aria-label="I_Sokie applications">
            <h2>Applications</h2>

            <a class="app-card trope-card" href="https://trope.isokie.com/">
                <img class="app-icon" src="https://trope.isokie.com/favicon.ico" alt="">
                <span class="app-text">
                    <span class="app-name">Trope Player</span>
                    <span class="app-domain">trope.isokie.com</span>
                </span>
            </a>

            <a class="app-card sefaria-card" href="https://sefaria.isokie.com/">
                <img class="app-icon" src="https://sefaria.isokie.com/favicon.ico" alt="">
                <span class="app-text">
                    <span class="app-name">Sefaria Hebrew</span>
                    <span class="app-domain">sefaria.isokie.com</span>
                </span>
            </a>

            <a class="app-card trans-card" href="https://trans.isokie.com/">
                <img class="app-icon" src="https://trans.isokie.com/favicon.ico" alt="">
                <span class="app-text">
                    <span class="app-name">Transliteration Engine</span>
                    <span class="app-domain">trans.isokie.com</span>
                </span>
            </a>
        </aside>

        <main class="home-container">
            <img src="ISokieLogo_SM_Clear.png"
                 alt="I_Sokie Enterprises">

            <div class="thread-section">
    <img src="Thread.png"
         class="thread-image"
         alt="Thread">

    <div class="thread-text">
        A common thread for generating resources for Torah text retrieval and trope processing.
    </div>
</div>
        </main>

    </div>
</body>
</html>
